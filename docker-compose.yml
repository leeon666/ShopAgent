services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shopagent-db
    environment:
      POSTGRES_USER: shopagent
      POSTGRES_PASSWORD: shopagent
      POSTGRES_DB: shopagent
    ports:
      - "5432:5432"
    volumes:
      - shopagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopagent -d shopagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopagent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: shopagent-api
    environment:
      DATABASE_URL: postgresql+psycopg://shopagent:shopagent@db:5432/shopagent
      REDIS_URL: redis://redis:6379/0
      SHOP_SECRET_KEY: change-me-in-real-deployment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    container_name: shopagent-worker
    environment:
      DATABASE_URL: postgresql+psycopg://shopagent:shopagent@db:5432/shopagent
      REDIS_URL: redis://redis:6379/0
      SHOP_SECRET_KEY: change-me-in-real-deployment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app.celery_app worker --loglevel=info

volumes:
  shopagent_pgdata:
