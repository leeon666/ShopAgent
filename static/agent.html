<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopAgent 售后 Agent</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { max-width: 980px; margin: 0 auto; padding: 32px 20px; }
    .panel { border: 1px solid #e5e7eb; border-radius: 16px; padding: 20px; margin: 16px 0; background: #fff; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
    input, textarea, button { font: inherit; }
    input, textarea { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
    textarea { min-height: 90px; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; cursor: pointer; background: #111827; color: white; }
    button.secondary { background: #4b5563; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f9fafb; padding: 16px; border-radius: 10px; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <h1>ShopAgent 售后 Agent</h1>
  <p class="muted">一键准备演示订单和售后工单，然后观察 Agent 的节点流转与结构化结论。</p>

  <section class="panel">
    <div class="row">
      <button onclick="setupDemo()">一键准备演示数据</button>
      <button class="secondary" onclick="runAgent()">运行流式 Agent</button>
    </div>
    <div class="row">
      <input id="ticketId" placeholder="售后工单 ID">
    </div>
    <div class="row">
      <textarea id="message">商品破损，想申请退款</textarea>
    </div>
  </section>

  <section class="panel">
    <h2>运行过程</h2>
    <pre id="logs">等待开始...</pre>
  </section>

  <script src="/static/agent.js"></script>
</body>
</html>
